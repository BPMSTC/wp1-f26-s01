name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: wp1-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_CORE_OUTPUT: none
      APP_NAME: ${{ vars.APP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_SERVER: ${{ vars.ACR_SERVER }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to container registry
        run: az acr login --name "$ACR_NAME"
      - name: Build with Docker Compose and push an immutable tag
        run: |
          export IMAGE_NAME="$ACR_SERVER/$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker compose -f compose.yml build web
          docker compose -f compose.yml push web
      - name: Deploy to the preconfigured student app
        run: |
          az containerapp ingress enable --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --type external --target-port 8080 --transport auto
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_REPOSITORY:$GITHUB_SHA" \
            --min-replicas 0 --max-replicas 1 --cpu 0.25 --memory 0.5Gi
      - name: Verify HTTPS and SQL connectivity
        run: |
          host=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for path in health health/db; do
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 40 "https://$host/$path"; then ok=true; break; fi
              sleep 10
            done
            if [ "$ok" != true ]; then echo "Check failed: $path"; exit 1; fi
          done
